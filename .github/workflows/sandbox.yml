name: Sandbox

# Runs the live-network integration tests gated on STELLAR_NETWORK_SANDBOX
# against a local stellar/quickstart container. The default `Go` workflow
# stays hermetic; this is a complement, not a replacement (W§6.D.1).

on:
  push:
    branches: [main, master, "ci/**"]
  pull_request:
  workflow_dispatch:

jobs:
  sandbox-test:
    strategy:
      matrix:
        os: [ubuntu-22.04]
        go: ["1.25"]
    runs-on: ${{ matrix.os }}
    services:
      quickstart:
        # Pin a specific tag (not :latest) so CI doesn't break on upstream
        # image churn. Bump deliberately when newer Soroban features land.
        image: stellar/quickstart:testing
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -fsS http://localhost:8000/soroban/rpc -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' | grep -q healthy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 60
          --health-start-period 60s
        env:
          ENABLE_LOGS: "true"
          NETWORK: "local"
          # stellar/quickstart:testing now ships protocol-26 host binaries
          # (stellar-rpc 26.x / stellar-core v26.x). Pair PROTOCOL_VERSION with
          # the stellar-cli version below — CLI/host config drift surfaces as
          # `HostError: Error(Context, InternalError)` during simulation.
          PROTOCOL_VERSION: "26"
      # The hermetic Go workflow already exercises the SQL-touching packages
      # against Postgres 12/16; include Postgres here too so `go test ./...`
      # has a single command surface in both workflows.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      STELLAR_NETWORK_SANDBOX: "1"
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
    - uses: actions/checkout@v3
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
        fetch-depth: '0'
    - uses: ./.github/actions/setup-go
      with:
        go-version: ${{ matrix.go }}
    - name: Wait for Soroban RPC
      run: |
        for i in $(seq 1 60); do
          if curl -fsS http://localhost:8000/soroban/rpc \
            -X POST -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' \
            | grep -q '"status":"healthy"'; then
            echo "Soroban RPC is healthy"
            exit 0
          fi
          echo "Waiting for Soroban RPC… ($i/60)"
          sleep 5
        done
        echo "Soroban RPC never became healthy" >&2
        exit 1
    - name: Wait for Friendbot
      run: |
        # Friendbot rejects bogus addresses with a 400 once it is up and
        # talking to core. Treat any non-502 / non-connection-refused
        # response as readiness.
        for i in $(seq 1 60); do
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            'http://localhost:8000/friendbot?addr=GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' || true)
          if [ "$code" != "000" ] && [ "$code" != "502" ] && [ "$code" != "503" ] && [ "$code" != "504" ]; then
            echo "Friendbot is up (HTTP $code on a bogus address — expected 400)"
            exit 0
          fi
          echo "Waiting for Friendbot… ($i/60) last code=$code"
          sleep 5
        done
        echo "Friendbot never became reachable" >&2
        exit 1
    # Install the stellar CLI so the wrap step below can invoke
    # `contract asset deploy --asset native`. Pin to a release matching the
    # quickstart PROTOCOL_VERSION above so CLI-side simulation doesn't trip
    # on config-setting drift between the CLI's bundled host and core.
    - name: Install stellar CLI
      run: |
        set -euxo pipefail
        STELLAR_CLI_VERSION="26.0.0"
        curl -fsSL -o /tmp/stellar-cli.tar.gz \
          "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
        mkdir -p "$HOME/.local/bin"
        tar -xzf /tmp/stellar-cli.tar.gz -C "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/stellar" --version
    # Wrap the native XLM asset into its Stellar Asset Contract on the
    # sandbox so tests that invoke the native SAC's `transfer` / `balance`
    # host functions (the 4 tests previously listed in -skip) find the
    # contract instance in ledger storage. Without this step those tests
    # fail simulation with HostError: Error(Context, InternalError) /
    # MissingValue because the native SAC is only auto-instantiated on
    # networks where someone has previously paid to wrap it — quickstart
    # starts blank. The contract ID is derived deterministically from the
    # asset descriptor + network passphrase, so the SDK side (asset.Token
    # over xdr.MustNewNativeAsset()) finds it without any env var. Re-runs
    # are idempotent: a subsequent `asset deploy --asset native` against an
    # already-wrapped native SAC returns the same ID; tolerate non-zero
    # exit and grep for the "already" / "exists" signal the CLI prints.
    - name: Wrap native XLM SAC on sandbox
      env:
        RPC_URL: "http://localhost:8000/soroban/rpc"
        NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
      run: |
        set -euxo pipefail
        IDENTITY="sac_deployer"
        if ! stellar keys public-key "$IDENTITY" >/dev/null 2>&1; then
          stellar keys generate "$IDENTITY" \
            --rpc-url "$RPC_URL" \
            --network-passphrase "$NETWORK_PASSPHRASE"
        fi
        if ! stellar keys fund "$IDENTITY" \
            --rpc-url "$RPC_URL" \
            --network-passphrase "$NETWORK_PASSPHRASE" 2>&1 | tee /tmp/sac-fund.log; then
          grep -qi "already" /tmp/sac-fund.log
        fi
        stellar contract asset deploy \
          --asset native \
          --source-account "$IDENTITY" \
          --rpc-url "$RPC_URL" \
          --network-passphrase "$NETWORK_PASSPHRASE" 2>&1 | tee /tmp/sac-deploy.log \
          || grep -qiE "already|exists" /tmp/sac-deploy.log
    - name: Run sandbox-gated tests
      # The 4 native-SAC tests (TestSandbox_Token_TransferLifecycle,
      # TestSandbox_Token_BalanceReadOnly, TestSandbox_Token_TransferThenBalance,
      # TestSandbox_Lifecycle_SACTransfer) are now unblocked by the
      # wrap-native-SAC step above.
      run: |
        go test ./... -count=1 -timeout 15m
